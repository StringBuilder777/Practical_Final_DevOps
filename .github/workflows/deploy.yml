name: Deploy EC2 Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            cd "${{ secrets.EC2_PROJECT_PATH }}"

            echo "Ruta actual en EC2:"
            pwd

            echo "Archivos encontrados:"
            ls -la

            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: No se encontro docker-compose.yml en $(pwd)"
              echo "Busca el archivo compose dentro del proyecto:"
              find . -maxdepth 3 -iname '*compose*' -print
              exit 1
            fi

            echo "Actualizando codigo desde GitHub..."
            git pull origin main

            echo "Deteniendo contenedores anteriores..."
            docker compose -f docker-compose.yml down

            echo "Reconstruyendo y levantando servicios..."
            docker compose -f docker-compose.yml up -d --build

            echo "Limpiando imagenes antiguas..."
            docker image prune -f

            echo "Despliegue finalizado."
          EOF
