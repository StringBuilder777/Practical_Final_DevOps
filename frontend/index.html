<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login de usuario DevOps</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #eef2f7;
    }

    .panel {
      width: min(92vw, 380px);
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      line-height: 1.2;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #b9c2d0;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #mensaje {
      min-height: 24px;
      margin: 18px 0 0;
      text-align: center;
      font-weight: 700;
    }

    .error {
      color: #b91c1c;
    }

    .ok {
      color: #047857;
    }

    .oculto {
      display: none;
    }

    .bienvenida {
      text-align: center;
    }

    .bienvenida p {
      margin: 0 0 20px;
      font-size: 18px;
      line-height: 1.5;
    }

    .contador {
      margin-bottom: 20px;
      padding: 14px;
      color: #0f172a;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    .contador strong {
      display: block;
      margin-top: 4px;
      font-size: 30px;
    }

    .boton-secundario {
      color: #1f2937;
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <main id="login" class="panel">
    <h1>Login</h1>

    <form id="formulario-login">
      <label for="usuario">Usuario 123</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="boton-login" type="submit">Entrar</button>
    </form>

    <p id="mensaje"></p>
  </main>

  <section id="panel-bienvenida" class="panel bienvenida oculto">
    <h1>Bienvenido</h1>
    <p id="texto-bienvenida"></p>
    <div class="contador">
      Veces que has iniciado sesión
      <strong id="contador-login">0</strong>
    </div>
    <button id="boton-salir" class="boton-secundario" type="button">Salir</button>
  </section>

  <script>
    const login = document.getElementById('login');
    const panelBienvenida = document.getElementById('panel-bienvenida');
    const textoBienvenida = document.getElementById('texto-bienvenida');
    const contadorLogin = document.getElementById('contador-login');
    const formulario = document.getElementById('formulario-login');
    const boton = document.getElementById('boton-login');
    const botonSalir = document.getElementById('boton-salir');
    const mensaje = document.getElementById('mensaje');

    formulario.addEventListener('submit', async (event) => {
      event.preventDefault();

      const datos = {
        usuario: formulario.usuario.value.trim(),
        password: formulario.password.value
      };

      boton.disabled = true;
      mensaje.textContent = 'Validando...';
      mensaje.className = '';

      try {
        const respuesta = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();
        mensaje.textContent = resultado.mensaje;
        mensaje.className = respuesta.ok ? 'ok' : 'error';

        if (respuesta.ok) {
          login.classList.add('oculto');
          panelBienvenida.classList.remove('oculto');
          textoBienvenida.textContent = `Hola, ${resultado.usuario}. Has iniciado sesión correctamente.`;
          contadorLogin.textContent = resultado.iniciosSesion;
          formulario.reset();
        }
      } catch (error) {
        mensaje.textContent = 'No se pudo conectar con el backend';
        mensaje.className = 'error';
      } finally {
        boton.disabled = false;
      }
    });

    botonSalir.addEventListener('click', () => {
      panelBienvenida.classList.add('oculto');
      login.classList.remove('oculto');
      mensaje.textContent = '';
      mensaje.className = '';
    });
  </script>
</body>
</html>
