services:
  frontend:
    image: nginx
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    networks:
      - red_app
    depends_on:
      - backend
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: escuela
      DB_USER: admin
      DB_PASSWORD: admin123
    ports:
      - "3000:3000"
    networks:
      - red_app
    depends_on:
      - db
  db:
    image: postgres
    environment:
      POSTGRES_DB: escuela
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - datos_postgres:/var/lib/postgresql
    networks:
      - red_app

volumes:
  datos_postgres:

networks:
  red_app:
    name: red_app
    driver: bridge